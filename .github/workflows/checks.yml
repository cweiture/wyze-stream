name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg iproute2
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n youtube-relay.sh
      - run: python3 tools/prepare_public.py --audit-only
